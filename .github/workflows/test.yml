name: test

on:
  push:
  pull_request:

jobs:
  guard-linux:
    name: guard-only (Ubuntu, no MLX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync test dependencies (no MLX extra)
        run: uv sync --extra test
      - name: Unit tests
        run: uv run pytest -q
      - name: Guard corpus and hook latency
        run: uv run python benchmarks/evaluate_guard.py --latency-samples 20
      - name: Evaluation self-check
        run: uv run python benchmarks/evaluate_codex.py --self-check
      - name: Whitespace check
        run: git diff --check

  full-mac:
    name: full suite (macOS, MLX)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync test and MLX dependencies
        run: uv sync --extra test --extra mlx
      - name: Unit tests
        run: uv run pytest -q
      - name: Guard corpus and hook latency
        run: uv run python benchmarks/evaluate_guard.py --latency-samples 20
      - name: Evaluation self-check
        run: uv run python benchmarks/evaluate_codex.py --self-check
      - name: Build
        run: uv build
      - name: Whitespace check
        run: git diff --check
